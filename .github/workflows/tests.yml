name: MiniWrapper quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes older checks on the same branch.
concurrency:
  group: miniwrapper-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast regression and expression graph tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:fast

  pdf:
    name: Direct PDF parse and raster check
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate synthetic evidence-backed PDF
        run: node tests/pdf-smoke.mjs
      - name: Install independent PDF parser and rasterizer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Parse and render PDF with independent Poppler tools
        run: |
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          pdfinfo test-results/pdf-render/shader-study.pdf > test-results/pdf-render/structure.txt
          pdftotext -layout test-results/pdf-render/shader-study.pdf test-results/pdf-render/extracted.txt
          grep -q 'Materials and methods' test-results/pdf-render/extracted.txt
          grep -q 'UNREVIEWED' test-results/pdf-render/extracted.txt
          grep -q 'References' test-results/pdf-render/extracted.txt
          grep -q 'Appendix A' test-results/pdf-render/extracted.txt
          pdftoppm -scale-to 1100 -png test-results/pdf-render/shader-study.pdf test-results/pdf-render/page >/dev/null
          test -s test-results/pdf-render/page-1.png
          test -s test-results/pdf-render/page-2.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miniwrapper-direct-pdf-qa
          path: |
            test-results/pdf-render/
            test-results/pdf-render-repeat/
          if-no-files-found: ignore

  latex:
    name: Native LaTeX compilation and visual structure QA
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install LaTeX compiler and independent PDF inspectors
        run: sudo apt-get update -qq && sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended latexmk poppler-utils
      - name: Produce archived evidence, source figures and manuscript LaTeX
        run: node tests/pdf-smoke.mjs
      - name: Compile using actual pdfLaTeX engine
        run: cd test-results/pdf-render && bash build-latex.sh
      - name: Check PDF checksum filename, pages, image count and text bounds
        run: python3 tests/inspect-latex-pdf.py test-results/pdf-render
      - name: Build nine-observation replicated manuscript
        run: node tests/pdf-smoke.mjs --repeat
      - name: Compile nine-observation appendix with native pdfLaTeX
        run: cd test-results/pdf-render-repeat && bash build-latex.sh
      - name: Independently inspect all nine embedded source images and receipt
        run: python3 tests/inspect-latex-pdf.py test-results/pdf-render-repeat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academic-latex-pdf-qa
          path: |
            test-results/pdf-render/
            test-results/pdf-render-repeat/
          if-no-files-found: ignore

  browser:
    name: Mobile browser and WebGL smoke
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academic-ui-visual-audit
          path: test-results/visual-audit/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: miniwrapper-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
